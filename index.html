<style>
:root{--wall:#dde5ef;--soft:#eef0f2;--body:#fff;--concrete:#5b6169;--floor:#24272b;--marker:#2f45c9;--ok:#1f8a4c;--hold:#c98a12;--line:#d9dde2;--sale:#d2361f;--sale-bg:#fdecea;--photo-wall:#e3e6ea;--photo-floor:#3a3f45;--tg:#229ed9;--vb:#7360f2;
 --font-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-marker:"Caveat","Segoe Print",cursive;
 --r-photo:12px;--r-card:16px;--r-sheet:20px;--r-field:10px;--r-tag:3px;--gutter:16px;--tap:44px;--safe-b:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--wall) url(bg.svg) 0 0/480px 480px}
body{margin:0;background:transparent;color:var(--floor);font-family:var(--font-ui);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
mark{background:transparent;color:inherit;box-shadow:inset 0 -.42em #2f45c933;border-radius:1px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.no-scroll{overflow:hidden}

/* chips & buttons */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--body);color:var(--floor);font-size:14px;font-weight:500;white-space:nowrap;flex:none;transition:background-color .15s,border-color .15s,color .15s}
.chip:hover{border-color:#b9bfc6}
.chip[aria-pressed=true]{background:var(--marker);border-color:var(--marker);color:#fff}
.chip[aria-pressed=true] .cnt{color:#ffffffd1}
.chip svg{width:20px;height:20px}
.cnt{color:var(--concrete);font-weight:400;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:15px;text-decoration:none;transition:background-color .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5;cursor:default}
.primary{background:var(--marker);color:#fff}.primary:hover{background:#2638a8}
.ghost{background:transparent;border-color:var(--line);color:var(--floor)}.ghost:hover{background:#24272b0a}
.vb{background:var(--body);border-color:var(--line);color:var(--vb)}
.block{flex:1}

/* page */
.page{max-width:1200px;margin:0 auto;padding-bottom:calc(24px + var(--safe-b))}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px var(--gutter) 6px}
.emblem{flex:none;width:48px;height:48px;border-radius:50%}
.shop{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.header a{color:inherit;text-decoration:none;border-radius:8px}.header a:has(.emblem){flex:none;border-radius:50%}
.tagline{font:700 1.45em/1 var(--font-marker);color:var(--marker)}
/* Назва магазину: на телефоні «Вигідно» завжди другим рядком, щоб шапка однаково виглядала обома мовами */
@media(max-width:639px){.tagline{display:block}}
@media(max-width:389px){.shop{font-size:17px}.logo{width:36px;height:36px}.header{gap:8px}}
.sticky{position:sticky;top:0;z-index:10;padding:8px var(--gutter) 10px;background:#dde5efd9;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 14px;background:var(--body);border:1.5px solid var(--floor);border-radius:14px;color:var(--concrete)}
.search:focus-within{border-color:var(--marker);box-shadow:0 0 0 3px #2f45c929}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--floor);font-size:16px;font-weight:500}
.search input::placeholder{color:#7c828a;font-weight:400}
.search input::-webkit-search-cancel-button{display:none}
.iconbtn{display:grid;place-items:center;flex:none;width:var(--tap);height:var(--tap);border:0;border-radius:50%;background:transparent;color:var(--concrete)}
.iconbtn:hover{background:var(--soft)}
.iconbtn[hidden]{display:none}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px var(--gutter) 8px;scrollbar-width:none;scroll-padding:0 var(--gutter)}
.scroller::-webkit-scrollbar{display:none}
.fbtn{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 16px 0 14px;border:0;border-radius:999px;background:var(--floor);color:#fff;font-weight:600;font-size:14px}
.fbtn.on{background:var(--marker)}
.active{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px var(--gutter) 0}
.achip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px 0 12px;border:1.5px solid var(--marker);border-radius:999px;background:#2f45c912;color:var(--marker);font-size:13.5px;font-weight:600}
.reset{min-height:var(--tap);padding:0 8px;border:0;background:none;color:var(--floor);font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px var(--gutter) 8px}
.count{font-size:14px;color:var(--concrete)}
.tools{display:flex;align-items:center;gap:4px}.tools .fbtn{min-height:40px;padding:0 14px 0 12px}
.sort{position:relative;display:inline-flex;align-items:center}
.sort select{appearance:none;-webkit-appearance:none;min-height:var(--tap);padding:0 30px 0 12px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:600;cursor:pointer}
.sort select:hover{background:#24272b0d}
.sort svg{position:absolute;right:12px;pointer-events:none}
/* категорії: один компактний рядок + розгорнутий список за групами */
.cats{padding-bottom:6px}
.cats .chip{min-height:38px;padding:0 12px;gap:5px;font-size:13.5px}
.cats .chip svg{width:18px;height:18px}
.csubs{display:flex;flex-wrap:wrap;gap:2px 4px;margin:0 0 6px 18px;padding:0 4px 0 12px;border-left:2px solid var(--line)}
.csub{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 8px;border:0;border-radius:8px;background:none;color:var(--concrete);font-size:13px;font-weight:500}
.csub:hover{background:var(--soft);color:var(--floor)}.csub[aria-pressed=true]{background:#2f45c914;color:var(--marker)}.csub.zero{opacity:.45}
.more{order:-1;background:var(--soft)}
.more.on{border-color:var(--marker);background:#2f45c914;color:var(--marker)}
.more svg.car{width:12px;height:12px;transition:transform .15s}
.more[aria-expanded=true]{border-color:var(--floor)}
.more[aria-expanded=true] svg.car{transform:rotate(180deg)}
.chip.sale svg{color:#d2361f}.chip.sale[aria-pressed=true] svg{color:#fff}.citem.sale svg{color:#d2361f}
.catmenu{margin:0 var(--gutter) 10px;padding:14px 14px 6px;background:var(--body);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:0 8px 24px #24272b14;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 8px}
.catmenu[hidden]{display:none}
.cgroup{margin-bottom:10px}
.cgroup h3{margin:0 0 4px;padding:0 8px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--concrete)}
.citem{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0 8px;border:0;border-radius:10px;background:none;text-align:left;font-size:14px;font-weight:500}
.citem:hover{background:var(--soft)}
.citem svg{width:22px;height:22px;flex:none}
.citem .cnt{margin-left:auto}
.citem[aria-pressed=true]{background:#2f45c914;color:var(--marker)}
.citem[aria-pressed=true] .cnt{color:var(--marker)}
.citem.zero{opacity:.45}
.citem span.nm{line-height:1.2}
@media(max-width:639px){.catmenu{display:block;padding:12px 12px 2px}.cgroup{display:flex;flex-wrap:wrap;gap:6px}.cgroup h3{width:100%;padding:0 2px}.citem{width:auto;min-height:38px;gap:6px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:14px}.citem svg{width:18px;height:18px}.citem .cnt{margin-left:0}.citem[aria-pressed=true]{border-color:var(--marker)}.cblock{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin:2px 0}.csubs{display:flex;flex-wrap:wrap;gap:4px;margin-left:22px;padding:2px 0 4px 10px;border-left:2px solid var(--line)}.csub{min-height:34px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--body)}}
@media(min-width:960px){.catmenu{grid-template-columns:repeat(5,minmax(0,1fr))}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0 var(--gutter);list-style:none}
.grid>li{display:flex;min-width:0}.grid>li>*{flex:1}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.header{padding-top:24px}.logo{width:52px;height:52px}.emblem{width:64px;height:64px}.shop{font-size:22px}}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:8px var(--gutter);padding:28px 20px;border:1.5px dashed #b6bcc3;border-radius:var(--r-card)}
.empty h2{font-size:19px;font-weight:650}.empty p{color:var(--concrete);margin-bottom:8px}
.footer{margin:36px var(--gutter) 0;font-size:13px;color:var(--concrete)}
.fcard{display:flex;flex-direction:column;gap:14px;padding-top:20px;border-top:1px solid #24272b1f}
@media(min-width:960px){.fcard{flex-direction:row;align-items:center;gap:40px}.fbtns{margin-left:auto}.fbtns .btn{flex:none;min-width:150px}}
.faddr{display:flex;gap:10px;align-items:flex-start;color:var(--floor);font-size:15px;text-decoration:none}
.faddr svg{flex:none;margin-top:1px;color:var(--marker)}
.faddr small{display:block;color:var(--concrete);font-size:13px}
.faddr u{display:inline-block;margin-top:2px;color:var(--marker);font-size:13.5px;font-weight:600;text-decoration:none}
.fbtns{display:flex;gap:8px}.fbtns .btn{flex:1;min-height:44px;padding:0 12px;font-size:14px}
.tgb{background:var(--tg);color:#fff}
.fupd{margin:10px 2px 0}
.fcats{display:flex;flex-wrap:wrap;gap:4px 14px;margin:14px 2px 0;font-size:12.5px}.fcats a{color:var(--concrete);text-decoration:none}.fcats a:hover{text-decoration:underline}
.flang{margin:12px 2px 0;font-size:12.5px}.flang a{color:var(--concrete)}

/* ---- вітрина на головній: плитки категорій + «Найбільші знижки» і «Нові надходження» ---- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 0;padding:0 var(--gutter);list-style:none}
@media(min-width:960px){.tiles{grid-template-columns:repeat(9,minmax(0,1fr));gap:12px}}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;width:100%;height:100%;min-height:96px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--body);text-align:left}
.tile:hover{border-color:#b9bfc6}
.tile svg{width:30px;height:30px;color:var(--marker)}
.tile b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.tile .cnt{font-size:12px}
.tile.sale{background:var(--sale-bg);border-color:#f3c4bd}.tile.sale svg{color:var(--sale)}
.shelf{margin:22px 0 0}
.shead2{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 var(--gutter);margin-bottom:6px}
.shead2 h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.shead2 button{min-height:var(--tap);padding:0 4px;border:0;background:none;color:var(--marker);font-weight:600;font-size:14px;white-space:nowrap}
.hrow{display:grid;grid-auto-flow:column;grid-auto-columns:42%;gap:10px;overflow-x:auto;margin:0;padding:0 var(--gutter) 6px;list-style:none;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding:0 var(--gutter)}
.hrow::-webkit-scrollbar{display:none}
.hrow>li{display:flex;min-width:0;scroll-snap-align:start}.hrow>li>*{flex:1}
@media(min-width:640px){.hrow{grid-auto-columns:28%}}
@media(min-width:960px){.hrow{grid-auto-columns:calc((100% - 2*var(--gutter) - 4*18px)/5);gap:18px}}
.allbtn{display:flex;width:calc(100% - 2*var(--gutter));max-width:420px;margin:28px auto 0}
.morebtn{display:flex;flex-direction:column;align-items:center;gap:8px;margin:22px var(--gutter) 0;text-align:center}
.morebtn .btn{width:100%;max-width:420px;background:var(--body)}
.morebtn small{color:var(--concrete);font-size:13px}

/* price sticker */
.sticker{display:inline-flex;align-items:baseline;gap:4px;padding:0 10px 1px 9px;background:var(--body);border:1px solid var(--line);border-radius:var(--r-tag);color:var(--marker);font-family:var(--font-marker);font-weight:700;line-height:1;transform:rotate(-2.5deg);transform-origin:left bottom;box-shadow:0 1px #24272b0f;white-space:nowrap}
.sticker .cur{font-size:.62em}
.sticker.m{font-size:30px;padding-top:2px}
.sticker.l{font-size:46px;padding:4px 14px 3px 12px}
.old{color:var(--concrete);font-size:12px;text-decoration:line-through;white-space:nowrap}
/* знижка */
.off{position:absolute;top:8px;right:8px;padding:4px 9px;border-radius:999px;background:var(--sale);color:#fff;font-size:13px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px #d2361f40}
.deal{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:10px 8px 0;font-variant-numeric:tabular-nums}
.deal .old{font-size:14px;color:var(--concrete);text-decoration-color:var(--sale);text-decoration-thickness:1.5px}
.save{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--sale-bg);color:var(--sale);font-size:12px;font-weight:650;white-space:nowrap}
.pdeal{margin:14px 0 0}
.pdeal .old{font-size:17px}
.pdeal .save{font-size:14px;padding:4px 10px}
.pdeal .pct{background:var(--sale);color:#fff}

/* photo frame */
.frame{position:relative;aspect-ratio:4/5;border-radius:var(--r-photo);overflow:hidden;background:linear-gradient(to bottom,var(--photo-wall) 0 67%,var(--floor) 67% 69.5%,var(--photo-floor) 69.5%)}
.frame img{width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.frame svg{display:block;width:100%;height:100%}

/* card */
.card{background:var(--body);border:1px solid var(--line);border-radius:var(--r-card);min-width:0}
.card>a{display:flex;flex-direction:column;height:100%;padding:4px 4px 10px;color:inherit;text-decoration:none;border-radius:inherit}
.card>a:hover .model{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.photo{position:relative}
.flags{position:absolute;top:8px;left:8px;display:flex;gap:4px}
.nph{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;background:#000000a6;color:#fff;font-size:12px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;backdrop-filter:blur(4px)}
.off~.nph{top:40px}
.nph svg{width:13px;height:13px}
.flags span{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.3}
.hold{background:var(--hold);color:var(--floor)}
.isnew{background:var(--floor);color:#fff}
.prow{display:flex;align-items:flex-end;margin:-22px 0 0 8px;position:relative}
.ctitle{margin:8px 8px 0;font-size:15px;font-weight:400;line-height:1.3;overflow-wrap:anywhere}
.brand{font-weight:650}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin:8px 8px 0;padding:0;list-style:none}
.pills li{padding:2px 8px;border-radius:999px;background:var(--soft);font-size:12px;line-height:1.3;white-space:nowrap}
.compact .ctitle{font-size:14px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:#14161980;opacity:0;transition:opacity .26s ease}
.panel{position:relative;display:flex;flex-direction:column;width:100%;max-width:640px;max-height:calc(100dvh - 48px);background:var(--body);border-radius:var(--r-sheet) var(--r-sheet) 0 0;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);outline:none}
.full .panel{height:calc(100dvh - 8px);max-height:none;max-width:720px}
.shown .backdrop{opacity:1}.shown .panel{transform:none}
.handle{flex:none;width:36px;height:4px;margin:8px auto 0;border-radius:2px;background:var(--line)}

const SKIP = /^(?:№|ID\b|ID[:\s#]*\d)|ціна|грн|знижка|^(?:new|сток|ctok|stock|розпродаж|мхп|mxп|mxp)$/i, CYR = /[а-яіїєґ]/;

function brandModel(text) {
  const lines = text.split('\n').map(bare).filter(Boolean);
  // Назва — перший рядок, що починається латиницею. Перед нею бувають позначки й вид техніки
  // («Під вбудову», «Медичний», «Бігова доріжка», «Орбітрек ProForm 320»): їх пропускаємо або відрізаємо.
  let i = -1, name = '';
  for (let j = 0, seen = 0; j < lines.length && seen < 5; j++) {
    if (SKIP.test(lines[j])) continue;
    seen++;
    const l = lines[j].replace(/\s+/g, ' ').replace(/^(?:[а-яіїєґʼ'’-]+ )+(?=[A-Za-z])/i, '');
    if (/^[A-Za-z]/.test(l)) { i = j; name = l; break; }
  }
  if (i < 0) return ['', ''];
  // Рядок-код перед назвою («SPT188NSH», потім «HouseFit HT-9200HP»): беремо наступну назву, якщо вона є.
  if (/^\S*\d\S*$/.test(name)) { const [b2, m2] = brandModel(lines.slice(i + 1).join('\n')); if (b2 && !/\d/.test(b2)) return [b2, m2]; }
  let [brand, ...rest] = name.split(' '), model = rest.join(' ');
  const nx = lines[i + 1];
  if (nx && /\d/.test(nx) && !CYR.test(nx) && nx.length <= 40) model = (model + ' ' + nx).trim();
  return [brand, model];
}

function sheetOpen(el) {

  el._ret = document.activeElement; el.hidden = false; document.documentElement.classList.add('no-scroll');
  requestAnimationFrame(() => requestAnimationFrame(() => { el.classList.add('shown'); el.querySelector('.panel').focus({preventScroll: true}); }));
}
function sheetClose(el) {

  el.classList.remove('shown');
  setTimeout(() => { el.hidden = true; if ($('#fsheet').hidden && $('#psheet').hidden && $('#csheet').hidden) document.documentElement.classList.remove('no-scroll'); el._ret?.focus?.({preventScroll: true}); }, 260);
}
for (const el of [$('#fsheet'), $('#psheet'), $('#csheet')]) {

const LI = 500;

function updApply() { const n = results(draft, HITS).length; $('#fapply').textContent = `Показати ${goods(n)}`; $('#fapply').disabled = !n; }

  const o = e.target.closest('[data-copen]'); if (o) { sheetClose($('#csheet')); showProduct(o.dataset.copen, openId ? 'replace' : 'push'); }
});
$('#cfoot').addEventListener('click', e => {
  const a = e.target.closest('[data-csend]'); if (!a) return;
  if (!cartLive().length) { e.preventDefault(); return; }
  try { window.goatcounter?.count?.({path: 'click-' + a.dataset.csend, title: `Кошик: ${goods(cartLive().length)}`, event: true}); } catch {}
  if (a.dataset.csend === 'viber') copyText(cartMsg()).then(ok => ok && toast('Список скопійовано — вставте його у Viber'));
});
// Кнопка на картці товару: додати / прибрати.
document.addEventListener('click', e => { const b = e.target.closest('[data-cart]'); if (!b) return; e.stopPropagation(); const p = BY.get(b.dataset.cart); if (!p) return;
  if (inCart(p.id)) { rmCart(p.id); toast('Прибрано з кошика'); } else addCart(p); }, true);

function footer() {
  const t = UPDATED ? new Date(UPDATED) : null;
  // Низ сторінки: адреса з посиланням на карту, кнопки месенджерів і час оновлення товарів.
  const ph = SHOP.viber.replace(/^(\d{3})(\d{2})(\d{3})(\d{2})(\d{2})$/, '+$1 $2 $3 $4 $5');
  $('#footer').innerHTML = `<div class="fcard">
    <a class="faddr" href="${SHOP.mapUrl}" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>м. ${esc(SHOP.city)}, ${esc(SHOP.address)}<small>${esc(SHOP.addressHint)}</small><u>Відкрити на карті →</u></span></a>
    <p class="faddr"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>${esc(SHOP.hours)}</span></p>
    <div class="fbtns"><a class="btn tgb" href="https://t.me/${SHOP.tg}" target="_blank" rel="noopener" data-track="click-telegram">Telegram</a><a class="btn vb" href="viber://chat?number=%2B${SHOP.viber}" data-track="click-viber">Viber</a></div>
  </div>${t && !isNaN(t) ? `<p class="fupd">Товар оновлено ${t.toLocaleString('uk-UA', {day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'})}</p>` : ''}
  <nav class="fcats" aria-label="Розділи каталогу">${GROUPS.flatMap(g => g[1]).filter(id => CNT.get(id) && SLUG[id]).map(id => `<a href="katalog/${SLUG[id]}/">${esc(CAT[id].name)}</a>`).join('')}</nav>
  <p class="flang"><a href="ru/" hreflang="ru" lang="ru" data-lang="ru">На русском</a></p>`;
  $('#footer').onclick = e => { const a = e.target.closest('[data-track]'); if (a) track(a.dataset.track); };
}
fetch('products.json', {cache: 'no-cache'}).then(r => r.json()).catch(() => ({products: []})).then(d => {
  const seen = new Set();
  ALL = (d.products || []).map(parse).filter(p => p && !seen.has(p.id) && seen.add(p.id));
  BY = new Map(ALL.map(p => [p.id, p])); UPDATED = d.updated || '';
  BRANDS = [...new Set(ALL.map(p => p.brand).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  PMAX = Math.ceil(Math.max(1000, ...ALL.map(p => p.price || 0)) / 1000) * 1000;
  CNT = new Map(); for (const p of ALL) CNT.set(p.cat, (CNT.get(p.cat) || 0) + 1);
  SALES = ALL.filter(p => p.oldPrice).length; SUBN = new Map(Object.entries(SUBS).flatMap(([c, xs]) => xs.map(([id, , f]) => [c + '/' + id, ALL.filter(p => inCat(p, c) && f(p)).length])));
  buildIndex(ALL); S = fromURL(); render(); footer(); updCart();
  const p = new URLSearchParams(location.search).get('p'); if (p && BY.has(p)) showProduct(p);
});
</script>
</body>
</html>
