<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DDE5EF">
<title>Техніка з Європи | Вигідно</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='8' y='5' width='32' height='38' rx='4' fill='%23fff' stroke='%2324272B' stroke-width='3'/%3E%3Ccircle cx='24' cy='27' r='9' fill='none' stroke='%232F45C9' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--wall:#dde5ef;--soft:#eef0f2;--body:#fff;--concrete:#5b6169;--floor:#24272b;--marker:#2f45c9;--ok:#1f8a4c;--hold:#c98a12;--line:#d9dde2;--photo-wall:#e3e6ea;--photo-floor:#3a3f45;--tg:#229ed9;--vb:#7360f2;
 --font-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-marker:"Caveat","Segoe Print",cursive;
 --r-photo:12px;--r-card:16px;--r-sheet:20px;--r-field:10px;--r-tag:3px;--gutter:16px;--tap:44px;--safe-b:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--wall) url(bg.svg) 0 0/480px 480px}
body{margin:0;background:transparent;color:var(--floor);font-family:var(--font-ui);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
mark{background:transparent;color:inherit;box-shadow:inset 0 -.42em #2f45c933;border-radius:1px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.no-scroll{overflow:hidden}

/* chips & buttons */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--body);color:var(--floor);font-size:14px;font-weight:500;white-space:nowrap;flex:none;transition:background-color .15s,border-color .15s,color .15s}
.chip:hover{border-color:#b9bfc6}
.chip[aria-pressed=true]{background:var(--marker);border-color:var(--marker);color:#fff}
.chip[aria-pressed=true] .cnt{color:#ffffffd1}
.chip svg{width:20px;height:20px}
.cnt{color:var(--concrete);font-weight:400;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:15px;text-decoration:none;transition:background-color .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5;cursor:default}
.primary{background:var(--marker);color:#fff}.primary:hover{background:#2638a8}
.ghost{background:transparent;border-color:var(--line);color:var(--floor)}.ghost:hover{background:#24272b0a}
.vb{background:var(--body);border-color:var(--line);color:var(--vb)}
.block{flex:1}

/* page */
.page{max-width:1200px;margin:0 auto;padding-bottom:calc(24px + var(--safe-b))}
.header{padding:14px var(--gutter) 6px}
.shop{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.tagline{font-weight:400;color:var(--concrete)}
.sticky{position:sticky;top:0;z-index:10;padding:8px var(--gutter) 10px;background:#dde5efd9;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 14px;background:var(--body);border:1.5px solid var(--floor);border-radius:14px;color:var(--concrete)}
.search:focus-within{border-color:var(--marker);box-shadow:0 0 0 3px #2f45c929}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--floor);font-size:16px;font-weight:500}
.search input::placeholder{color:#7c828a;font-weight:400}
.search input::-webkit-search-cancel-button{display:none}
.iconbtn{display:grid;place-items:center;flex:none;width:var(--tap);height:var(--tap);border:0;border-radius:50%;background:transparent;color:var(--concrete)}
.iconbtn:hover{background:var(--soft)}
.iconbtn[hidden]{display:none}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px var(--gutter) 8px;scrollbar-width:none;scroll-padding:0 var(--gutter)}
.scroller::-webkit-scrollbar{display:none}
.fbtn{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 16px 0 14px;border:0;border-radius:999px;background:var(--floor);color:#fff;font-weight:600;font-size:14px}
.fbtn.on{background:var(--marker)}
.active{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px var(--gutter) 0}
.achip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px 0 12px;border:1.5px solid var(--marker);border-radius:999px;background:#2f45c912;color:var(--marker);font-size:13.5px;font-weight:600}
.reset{min-height:var(--tap);padding:0 8px;border:0;background:none;color:var(--floor);font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px var(--gutter) 8px}
.count{font-size:14px;color:var(--concrete)}
.sort{position:relative;display:inline-flex;align-items:center}
.sort select{appearance:none;-webkit-appearance:none;min-height:var(--tap);padding:0 30px 0 12px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:600;cursor:pointer}
.sort select:hover{background:#24272b0d}
.sort svg{position:absolute;right:12px;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0 var(--gutter);list-style:none}
.grid>li{display:flex;min-width:0}.grid>li>*{flex:1}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media(min-width:960px){.cats{flex-wrap:wrap;overflow:visible}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.header{padding-top:24px}.shop{font-size:22px}}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:8px var(--gutter);padding:28px 20px;border:1.5px dashed #b6bcc3;border-radius:var(--r-card)}
.empty h2{font-size:19px;font-weight:650}.empty p{color:var(--concrete);margin-bottom:8px}
.footer{margin-top:32px;padding:0 var(--gutter);font-size:13px;color:var(--concrete)}
.footer p+p{margin-top:4px}

/* price sticker */
.sticker{display:inline-flex;align-items:baseline;gap:4px;padding:0 10px 1px 9px;background:var(--body);border:1px solid var(--line);border-radius:var(--r-tag);color:var(--marker);font-family:var(--font-marker);font-weight:700;line-height:1;transform:rotate(-2.5deg);transform-origin:left bottom;box-shadow:0 1px #24272b0f;white-space:nowrap}
.sticker .cur{font-size:.62em}
.sticker.m{font-size:30px;padding-top:2px}
.sticker.l{font-size:46px;padding:4px 14px 3px 12px}
.old{color:var(--concrete);font-size:12px;text-decoration:line-through;white-space:nowrap}
.prow .old{margin:0 0 4px 12px}

/* photo frame */
.frame{position:relative;aspect-ratio:4/5;border-radius:var(--r-photo);overflow:hidden;background:linear-gradient(to bottom,var(--photo-wall) 0 67%,var(--floor) 67% 69.5%,var(--photo-floor) 69.5%)}
.frame img{width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.frame svg{display:block;width:100%;height:100%}

/* card */
.card{background:var(--body);border:1px solid var(--line);border-radius:var(--r-card);min-width:0}
.card>a{display:flex;flex-direction:column;height:100%;padding:4px 4px 10px;color:inherit;text-decoration:none;border-radius:inherit}
.card>a:hover .model{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.photo{position:relative}
.flags{position:absolute;top:8px;left:8px;display:flex;gap:4px}
.flags span{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.3}
.hold{background:var(--hold);color:var(--floor)}
.isnew{background:var(--floor);color:#fff}
.prow{display:flex;align-items:flex-end;margin:-22px 0 0 8px;position:relative}
.ctitle{margin:8px 8px 0;font-size:15px;font-weight:400;line-height:1.3;overflow-wrap:anywhere}
.brand{font-weight:650}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin:8px 8px 0;padding:0;list-style:none}
.pills li{padding:2px 8px;border-radius:999px;background:var(--soft);font-size:12px;line-height:1.3;white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:2px 8px;flex-wrap:wrap;margin:auto 8px 0;padding-top:10px;font-size:12px;color:var(--concrete);font-variant-numeric:tabular-nums}
.compact .ctitle{font-size:14px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:#14161980;opacity:0;transition:opacity .26s ease}
.panel{position:relative;display:flex;flex-direction:column;width:100%;max-width:640px;max-height:calc(100dvh - 48px);background:var(--body);border-radius:var(--r-sheet) var(--r-sheet) 0 0;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);outline:none}
.full .panel{height:calc(100dvh - 8px);max-height:none;max-width:720px}
.shown .backdrop{opacity:1}.shown .panel{transform:none}
.handle{flex:none;width:36px;height:4px;margin:8px auto 0;border-radius:2px;background:var(--line)}
.shead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 8px 4px var(--gutter);border-bottom:1px solid var(--line)}
.shead h2{font-size:18px;font-weight:650}
.floating{position:absolute;top:18px;right:18px;z-index:2;background:var(--body);border:1px solid var(--line);color:var(--floor)}
.floating:hover{background:#fff}
.mini{position:absolute;top:0;left:0;right:0;z-index:1;display:flex;align-items:center;height:64px;padding:12px 72px 0 var(--gutter);border-radius:var(--r-sheet) var(--r-sheet) 0 0;border-bottom:1px solid var(--line);background:var(--body);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none;transition:opacity .15s}
.mini.on{opacity:1}.mini~.floating{top:14px}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sfoot{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:10px var(--gutter) calc(10px + var(--safe-b));border-top:1px solid var(--line);background:var(--body)}
@media(min-width:760px){.sheet{align-items:center;padding:24px}.panel{border-radius:var(--r-sheet);transform:translateY(32px);opacity:0;transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .2s}.shown .panel{opacity:1}.full .panel{height:min(860px,calc(100dvh - 48px))}.handle{display:none}}

/* filters */
.fwrap{padding:4px var(--gutter) 24px}
.fsec{margin:0;padding:18px 0 2px;border:0;min-width:0}
.fsec+.fsec{border-top:1px solid var(--line)}
.fsec legend{float:left;width:100%;margin-bottom:12px;padding:0;font-size:16px;font-weight:650}
.fsec legend+*{clear:both}
.sub{margin:4px 0 8px;font-size:14px;color:var(--concrete)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.field{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-field);background:var(--body);color:var(--concrete);font-size:14px}
.field:focus-within{border-color:var(--marker);box-shadow:0 0 0 1px var(--marker)}
.field input{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--floor);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.field input::placeholder{color:#8a9098;font-weight:400}
.slider{position:relative;height:44px;margin:-4px 10px 10px}
.track{position:absolute;top:50%;left:0;right:0;height:4px;margin-top:-2px;border-radius:2px;background:linear-gradient(to right,var(--line) var(--a),var(--marker) var(--a) var(--b),var(--line) var(--b))}
.slider input{position:absolute;inset:0 -10px;width:calc(100% + 20px);height:44px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.slider input:focus-visible{outline:none}
.slider input::-webkit-slider-runnable-track{background:none}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--marker);background:var(--body);pointer-events:auto;cursor:grab}
.slider input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;border:2px solid var(--marker);background:var(--body);pointer-events:auto;cursor:grab}
.slider input::-moz-range-track{background:none}
.slider input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--body),0 0 0 5px var(--marker)}
.switch{display:flex;align-items:center;gap:12px;min-height:var(--tap);margin-bottom:10px;font-size:15px;cursor:pointer}
.switch input{width:22px;height:22px;margin:0;accent-color:var(--marker)}

/* product */
.pwrap{padding-bottom:24px}
.gallery{position:relative;padding:8px 12px 0}
.gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r-photo)}
.gtrack::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center}
.slide>.frame{aspect-ratio:4/4.4;max-height:62dvh;width:100%}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots span{width:6px;height:6px;border-radius:50%;background:#ffffff80}
.dots .on{background:#fff;width:16px;border-radius:3px}
.nav{position:absolute;top:50%;display:none;place-items:center;width:var(--tap);height:var(--tap);margin-top:-22px;border:0;border-radius:50%;background:#ffffffeb;color:var(--floor)}
.nav:disabled{opacity:0;pointer-events:none}
.prev{left:22px}.next{right:22px}
@media(hover:hover) and (pointer:fine){.nav{display:grid}}
.pmain{padding:0 var(--gutter)}
.pmain .prow{margin:-30px 0 0 10px}
.ptitle{margin-top:14px;font-size:22px;line-height:1.25;font-weight:400}
.ptitle .brand{font-weight:700}
.pcat{margin-top:2px;color:var(--concrete);font-size:14px}
.idrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:12px}
.idrow b{font-weight:600;font-variant-numeric:tabular-nums}
.copy{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--body);font-size:13px;font-weight:500;color:var(--marker)}
.oktag,.holdtag{padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
.oktag{color:var(--ok);background:#1f8a4c1a}
.holdtag{background:var(--hold);color:var(--floor)}
.notice{margin-top:12px;padding:10px 12px;border-radius:var(--r-field);background:#c98a121f;font-size:14px}
.pblock{margin-top:22px}
.h3{font-size:16px;font-weight:650}
.specs{margin:10px 0 0;border-top:1px solid var(--line)}
.specs div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.specs dt{color:var(--concrete)}
.specs dd{margin:0;text-align:right;font-weight:500}
.desc{margin-top:8px;white-space:pre-line;color:#39414b}
.info{display:flex;gap:12px;padding:14px;border-radius:12px;background:var(--soft)}
.info p{margin-top:4px;font-size:14px}
.info+.info{margin-top:8px}
.info svg{flex:none;width:24px;height:24px;color:var(--floor)}
.muted{color:var(--concrete)}
.link{display:inline-flex;align-items:center;min-height:var(--tap);color:var(--marker);font-weight:600;font-size:14px;text-underline-offset:3px}
.similar{margin-top:28px}
.similar>h3{padding:0 var(--gutter)}
.simrow{display:flex;gap:10px;overflow-x:auto;padding:12px var(--gutter) 4px;scroll-snap-type:x proximity;scroll-padding-inline:var(--gutter);scrollbar-width:none}
.simrow::-webkit-scrollbar{display:none}
.simrow>*{flex:0 0 150px;scroll-snap-align:start}

#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--floor);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="page">
  <header class="header"><h1 class="shop">Техніка з Європи <span class="tagline">Вигідно</span></h1></header>
  <div class="sticky">
    <label class="search">
      <span class="vh">Пошук по каталогу</span>
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <input id="q" type="search" placeholder="Бренд або модель" enterkeyhint="search" autocomplete="off" spellcheck="false">
      <button type="button" class="iconbtn" id="qclear" aria-label="Очистити пошук" hidden></button>
    </label>
  </div>
  <nav class="scroller cats" id="cats" aria-label="Категорії"></nav>
  <div class="scroller" id="prices" role="group" aria-label="Ціна"></div>
  <div class="active" id="active" aria-label="Активні фільтри" hidden></div>
  <div class="toolbar">
    <p class="count" id="count" aria-live="polite"></p>
    <label class="sort"><span class="vh">Сортування</span><select id="sort"></select>
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 4.5l3 3 3-3"/></svg></label>
  </div>
  <div id="list"></div>
  <footer class="footer" id="footer"></footer>
</div>

<div class="sheet" id="fsheet" hidden>
  <div class="backdrop" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-label="Фільтри" tabindex="-1">
    <div class="handle" aria-hidden="true"></div>
    <header class="shead"><h2>Фільтри</h2><button type="button" class="iconbtn" data-close aria-label="Закрити"></button></header>
    <div class="sbody" id="fbody"></div>
    <div class="sfoot"><button type="button" class="btn ghost" id="freset">Скинути</button><button type="button" class="btn primary block" id="fapply"></button></div>
  </div>
</div>

<div class="sheet full" id="psheet" hidden>
  <div class="backdrop" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" tabindex="-1">
    <div class="handle" aria-hidden="true"></div>
    <div class="mini" id="pmini" aria-hidden="true"></div>
    <button type="button" class="iconbtn floating" data-close aria-label="Закрити"></button>
    <div class="sbody" id="pbody"></div>
    <div class="sfoot" id="pfoot"></div>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
/* ---------- налаштування магазину ---------- */
const SHOP = {
  name: 'Техніка з Європи', tagline: 'Вигідно', currency: 'грн',
  tg: 'domforttop', viber: '380509759605',
  address: 'вул. Вадима Гетьмана, 1', city: 'Київ', addressHint: 'метро Шулявська',
};
SHOP.mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(SHOP.address + ', ' + SHOP.city);

// Категорії сайту. Канал Telegram → категорія; пральні/сушильні та холодильники/морозильні
// розділяємо за текстом допису (terms).
const CATS = [
  {id:'washers', name:'Пральні машини', short:'Пральні', ch:'pralni_sushylni_mashyny', terms:['пралка','пральна','стиралка','стиральная']},
  {id:'dryers', name:'Сушильні машини', short:'Сушильні', ch:'pralni_sushylni_mashyny', match:/сушил|сушарк|сушка|тепловий насос|dryer|trockner/i, terms:['сушка','сушильна','сушильная']},
  {id:'fridges', name:'Холодильники', short:'Холодильники', ch:'holodylnyky_ta_morozylni_kamery', terms:['холодильник']},

const frame = (p, i = 0, eager) => p.photos[i]
  ? `<div class="frame"><img src="${esc(p.photos[i])}" alt="${esc(p.brand + ' ' + p.model)}, фото ${i + 1}" loading="${eager ? 'eager' : 'lazy'}" decoding="async" draggable="false" data-cat="${p.cat}"></div>`
  : `<div class="frame">${illustration(p.cat, 'Фото ще немає, схематичне зображення: ' + (CAT[p.cat]?.name || ''))}</div>`;
function card(p, hit, compact, eager) {
  const flags = (p.reserved ? '<span class="hold">Бронь</span>' : '') + (p.isNew ? '<span class="isnew">нова</span>' : '');
  return `<article class="card${compact ? ' compact' : ''}"><a href="${esc(toURL(S, p.id))}" data-open="${esc(p.id)}">
    <div class="photo">${frame(p, 0, eager)}${flags ? `<span class="flags">${flags}</span>` : ''}</div>
    ${p.price ? `<div class="prow">${sticker(p.price)}</div>` : ''}
    <h3 class="ctitle"><span class="brand">${hl(p.brand, hit?.brand)}</span> <span class="model">${hl(p.model, hit?.model)}</span></h3>
    ${!compact && p.chips.length ? `<ul class="pills" aria-label="Характеристики">${p.chips.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
    ${p.oldPrice && !compact ? `<p class="foot"><s class="old" aria-label="Стара ціна">${money(p.oldPrice)} грн</s></p>` : '<p class="foot"></p>'}</a></article>`;
}

function render() {
  HITS = search(S.q);
  $('#q').value !== S.q && ($('#q').value = S.q);
  $('#qclear').hidden = !S.q;
  const cc = countBy(S, HITS, 'cat', p => p.cat), total = [...cc.values()].reduce((a, b) => a + b, 0);
  $('#cats').innerHTML = `<button type="button" class="chip" data-cat="" aria-pressed="${!S.cat}">Усі<span class="cnt">${total}</span></button>` +
    CATS.filter(c => ALL.some(p => p.cat === c.id)).map(c => `<button type="button" class="chip" data-cat="${c.id}" aria-pressed="${S.cat === c.id}">${icon(c.id)}${esc(c.short)}<span class="cnt">${cc.get(c.id) || 0}</span></button>`).join('');
  const nf = nFilters(S);
  $('#prices').innerHTML = `<button type="button" class="fbtn${nf ? ' on' : ''}" id="fopen" aria-haspopup="dialog"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Фільтри${nf ? ` (${nf})` : ''}</span></button>` +
    PRESETS.map(r => `<button type="button" class="chip" data-preset="${r.id}" aria-pressed="${S.pmin === r.min && S.pmax === r.max}">${r.label}</button>`).join('');
  const act = activeChips(S);
  $('#active').hidden = !act.length;
  $('#active').innerHTML = act.map((a, i) => `<button type="button" class="achip" data-rm="${i}" aria-label="Прибрати фільтр: ${esc(a.label)}">${esc(a.label)}${X(12)}</button>`).join('') + (act.length ? '<button type="button" class="reset" data-resetall>Скинути все</button>' : '');
  const list = results(S, HITS), m = sortMode(S);
  $('#count').textContent = goods(list.length);
  $('#sort').innerHTML = (S.q.trim() ? '<option value="relevance">За збігом</option>' : '') + [['new', 'Новіші'], ['cheap', 'Дешевші'], ['expensive', 'Дорожчі']].map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  $('#sort').value = m;
  $('#list').innerHTML = list.length
    ? `<ul class="grid">${list.map((p, i) => `<li>${card(p, HITS?.get(p.key), false, i < 4)}</li>`).join('')}</ul>`
    : `<div class="empty"><h2>${ALL.length ? 'Нічого не знайшли' : 'Каталог оновлюється'}</h2><p>${ALL.length ? 'Спробуйте інший бренд або приберіть фільтр ціни' : 'Товари з’являться після першого оновлення.'}</p>${ALL.length ? '<button type="button" class="btn primary" data-resetall>Скинути фільтри</button>' : ''}</div>`;
}
function activeChips(s) {
  const a = [], add = (label, rm) => a.push({label, rm});
  if (s.pmin != null || s.pmax != null) { const pr = PRESETS.find(r => r.min === s.pmin && r.max === s.pmax); add(pr ? pr.label : range(s.pmin, s.pmax, ' грн'), x => ({...x, pmin: undefined, pmax: undefined})); }
  s.brands.forEach(b => add(b, x => ({...x, brands: x.brands.filter(y => y !== b)})));
  s.cond.forEach(c => add(c === 'new' ? 'нова' : 'б/в', x => ({...x, cond: x.cond.filter(y => y !== c)})));
  if (s.cat === 'washers') {
    s.load.forEach(l => add(l === 'front' ? 'Фронтальне' : 'Вертикальне', x => ({...x, load: x.load.filter(y => y !== l)})));
    s.kg && add(`від ${s.kg} кг`, x => ({...x, kg: undefined}));
    s.narrow && add(`Вузькі, до ${NARROW} см`, x => ({...x, narrow: false}));
  }
  (s.wmin != null || s.wmax != null) && add(`Ширина ${range(s.wmin, s.wmax, ' см')}`, x => ({...x, wmin: undefined, wmax: undefined}));
  (s.hmin != null || s.hmax != null) && add(`Висота ${range(s.hmin, s.hmax, ' см')}`, x => ({...x, hmin: undefined, hmax: undefined}));
  s.war && add(`Гарантія від ${s.war} міс`, x => ({...x, war: undefined}));
  return a;
}

/* ---------- шторки ---------- */
function sheetOpen(el) {
  if (!el.hidden && el.classList.contains('shown')) return;
  el._ret = document.activeElement; el.hidden = false; document.documentElement.classList.add('no-scroll');
  requestAnimationFrame(() => requestAnimationFrame(() => { el.classList.add('shown'); el.querySelector('.panel').focus({preventScroll: true}); }));
}
function sheetClose(el) {
  if (el.hidden) return;
  el.classList.remove('shown');
  setTimeout(() => { el.hidden = true; if ($('#fsheet').hidden && $('#psheet').hidden) document.documentElement.classList.remove('no-scroll'); el._ret?.focus?.({preventScroll: true}); }, 260);
}
for (const el of [$('#fsheet'), $('#psheet')]) {
  el.querySelectorAll('[data-close]').forEach(b => { if (b.tagName === 'BUTTON') b.innerHTML = X(16); b.onclick = () => el.id === 'psheet' ? closeProduct() : sheetClose(el); });
  el.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.stopPropagation(); el.id === 'psheet' ? closeProduct() : sheetClose(el); }
    if (e.key === 'Tab') { const f = el.querySelectorAll('a[href],button:not([disabled]),input,select,[tabindex]:not([tabindex="-1"])'); if (!f.length) return;
      const a = f[0], z = f[f.length - 1]; if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } }
  });
}

/* ---------- фільтри ---------- */
const LI = 500;
function renderFilters() {
  const f = draft, bc = countBy(f, HITS, 'brands', p => p.brand), lo = f.pmin ?? 0, hi = f.pmax ?? PMAX, pc = v => (Math.min(Math.max(v, 0), PMAX)) / PMAX * 100;
  const chip = (on, label, attrs, cnt) => `<button type="button" class="chip" aria-pressed="${on}" ${attrs}>${esc(label)}${cnt != null ? `<span class="cnt">${cnt}</span>` : ''}</button>`;
  const fields = (k, label) => `<div class="fields"><label class="field"><span>від</span><input inputmode="numeric" data-f="${k}min" value="${f[k + 'min'] ?? ''}" placeholder="—" aria-label="${label}, від"></label><label class="field"><span>до</span><input inputmode="numeric" data-f="${k}max" value="${f[k + 'max'] ?? ''}" placeholder="—" aria-label="${label}, до"></label></div>`;
  $('#fbody').innerHTML = `<div class="fwrap">
    <fieldset class="fsec"><legend>Ціна</legend>
      <div class="fields"><label class="field"><span>від</span><input inputmode="numeric" data-f="pmin" value="${f.pmin != null ? money(f.pmin) : ''}" placeholder="0" aria-label="Ціна, від"><span>грн</span></label>
      <label class="field"><span>до</span><input inputmode="numeric" data-f="pmax" value="${f.pmax != null ? money(f.pmax) : ''}" placeholder="${money(PMAX)}" aria-label="Ціна, до"><span>грн</span></label></div>
      <div class="slider" style="--a:${pc(lo)}%;--b:${pc(hi)}%"><div class="track"></div>
        <input type="range" min="0" max="${PMAX}" step="${LI}" value="${Math.min(lo, PMAX)}" data-r="lo" aria-label="Ціна, від" aria-valuetext="${money(lo)} грн">
        <input type="range" min="0" max="${PMAX}" step="${LI}" value="${Math.max(hi, 0)}" data-r="hi" aria-label="Ціна, до" aria-valuetext="${money(hi)} грн"></div>
      <div class="row">${PRESETS.map(r => chip(f.pmin === r.min && f.pmax === r.max, r.label, `data-fp="${r.id}"`)).join('')}</div></fieldset>
    <fieldset class="fsec"><legend>Бренд</legend><div class="row">${BRANDS.map(b => { const n = bc.get(b) || 0, on = f.brands.includes(b); return !on && !n ? '' : chip(on, b, `data-fb="${esc(b)}"`, n); }).join('')}</div></fieldset>
    <fieldset class="fsec"><legend>Стан</legend><div class="row">${chip(f.cond.includes('used'), 'б/в', 'data-fc="used"')}${chip(f.cond.includes('new'), 'нова', 'data-fc="new"')}</div></fieldset>
    ${f.cat === 'washers' ? `<fieldset class="fsec"><legend>Для пральних машин</legend>
      <p class="sub">Тип завантаження</p><div class="row">${chip(f.load.includes('front'), 'Фронтальне', 'data-fl="front"')}${chip(f.load.includes('top'), 'Вертикальне', 'data-fl="top"')}</div>
      <p class="sub">Завантаження</p><div class="row">${[0, 5, 6, 7, 8].map(k => chip((f.kg || 0) === k, k ? `від ${k} кг` : 'Будь-яке', `data-fk="${k}"`)).join('')}</div>
      <label class="switch"><input type="checkbox" data-fn ${f.narrow ? 'checked' : ''}><span>Вузькі, до ${NARROW} см</span></label></fieldset>` : ''}
    <fieldset class="fsec"><legend>Ширина, см</legend>${fields('w', 'Ширина, см')}</fieldset>
    <fieldset class="fsec"><legend>Висота, см</legend>${fields('h', 'Висота, см')}</fieldset>
    <fieldset class="fsec"><legend>Гарантія</legend><div class="row">${WARRANTY.map(w => chip((f.war || 0) === w, w ? `від ${w} міс` : 'Будь-яка', `data-fw="${w}"`)).join('')}</div></fieldset>
  </div>`;
  updApply();
}
function updApply() { const n = results(draft, HITS).length; $('#fapply').textContent = `Показати ${goods(n)}`; $('#fapply').disabled = !n; }
function setDraft(patch, rerender = true) {
  const st = $('#fbody').scrollTop; draft = {...draft, ...patch};
  if (rerender) { renderFilters(); $('#fbody').scrollTop = st; } else updApply();
}
const toggle = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
$('#fbody').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.fp) { const r = PRESETS.find(x => x.id === d.fp), on = draft.pmin === r.min && draft.pmax === r.max; setDraft(on ? {pmin: undefined, pmax: undefined} : {pmin: r.min, pmax: r.max}); }
  else if (d.fb) setDraft({brands: toggle(draft.brands, d.fb)});
  else if (d.fc) setDraft({cond: toggle(draft.cond, d.fc)});
  else if (d.fl) setDraft({load: toggle(draft.load, d.fl)});
  else if (d.fk != null) setDraft({kg: +d.fk || undefined});
  else if (d.fw != null) setDraft({war: +d.fw || undefined});
});
$('#fbody').addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.fn != null) return setDraft({narrow: t.checked});
  if (d.f) {
    const v = parseInt(t.value.replace(/\D/g, ''), 10), val = isNaN(v) ? undefined : v;
    if (d.f[0] === 'p' && val != null) t.value = money(val);
    setDraft({[d.f]: val}, false);
    if (d.f[0] === 'p') syncSlider();
    return;
  }
  if (d.r) {
    const lo = draft.pmin ?? 0, hi = draft.pmax ?? PMAX;
    let a = lo, b = hi; if (d.r === 'lo') a = Math.min(+t.value, hi - LI); else b = Math.max(+t.value, lo + LI);
    t.value = d.r === 'lo' ? a : b;
    draft = {...draft, pmin: a <= 0 ? undefined : a, pmax: b >= PMAX ? undefined : b};
    $('[data-f=pmin]').value = draft.pmin != null ? money(draft.pmin) : ''; $('[data-f=pmax]').value = draft.pmax != null ? money(draft.pmax) : '';
    syncSlider(); updApply();
  }
});
$('#fbody').addEventListener('change', e => { if (e.target.dataset.r || e.target.dataset.f?.[0] === 'p') { const st = $('#fbody').scrollTop; renderFilters(); $('#fbody').scrollTop = st; } });
function syncSlider() {
  const lo = draft.pmin ?? 0, hi = draft.pmax ?? PMAX, pc = v => Math.min(Math.max(v, 0), PMAX) / PMAX * 100, sl = $('#fbody .slider');
  sl.style.setProperty('--a', pc(lo) + '%'); sl.style.setProperty('--b', pc(hi) + '%');
  sl.querySelector('[data-r=lo]').value = Math.min(lo, PMAX); sl.querySelector('[data-r=hi]').value = hi;
}
$('#freset').onclick = () => setDraft({pmin: undefined, pmax: undefined, brands: [], cond: [], load: [], kg: undefined, narrow: false, wmin: undefined, wmax: undefined, hmin: undefined, hmax: undefined, war: undefined});
$('#fapply').onclick = () => { setState(draft); sheetClose($('#fsheet')); };

/* ---------- картка товару ---------- */
const msg = p => `Добрий день! Цікавить ID ${p.id}, ${p.brand} ${p.model}${p.price ? `, ${money(p.price)} грн` : ''} ${p.url || ''}`.trim();
function specsOf(p) {
  return [['Стан', p.isNew ? 'Нова' : 'Б/в'], ['Завантаження', p.kg && `${p.kg} кг`], ['Віджим', p.rpm && `${p.rpm} об/хв`],
    ['Тип завантаження', p.load && (p.load === 'front' ? 'Фронтальне' : 'Вертикальне')], ['Система охолодження', p.cooling],
    ['Місткість', p.sets && `до ${p.sets} комплектів`], ['Діагональ', p.diag && `${p.diag}″`],
    ['Висота', p.height && `${p.height} см`], ['Ширина', p.width && `${p.width} см`], ['Глибина', p.depth && `${p.depth} см`]].filter(r => r[1]);
}
function renderProduct(p) {
  const n = Math.max(p.photos.length, 1);
  const sim = ALL.filter(x => x.cat === p.cat && x.key !== p.key).sort((a, b) => Math.abs((a.price || 0) - (p.price || 0)) - Math.abs((b.price || 0) - (p.price || 0))).slice(0, 6);
  $('#psheet .panel').setAttribute('aria-label', `${p.brand} ${p.model}`);
  $('#pmini').textContent = `${p.brand} ${p.model}`;
  $('#pbody').innerHTML = `<article class="pwrap">
    <div class="gallery"><div class="gtrack" tabindex="${n > 1 ? 0 : -1}" aria-roledescription="галерея" aria-label="${esc(p.brand + ' ' + p.model)}: ${n} фото">${Array.from({length: n}, (_, i) => `<div class="slide">${frame(p, i, i === 0)}</div>`).join('')}</div>
      ${n > 1 ? `<div class="dots" aria-hidden="true">${Array.from({length: n}, (_, i) => `<span class="${i ? '' : 'on'}"></span>`).join('')}</div>
      <button type="button" class="nav prev" data-g="-1" aria-label="Попереднє фото" disabled>${ARROW('l')}</button><button type="button" class="nav next" data-g="1" aria-label="Наступне фото">${ARROW('r')}</button>` : ''}</div>
    <div class="pmain">
      ${p.price ? `<div class="prow">${sticker(p.price, 'l')}${p.oldPrice ? `<s class="old" style="font-size:15px">${money(p.oldPrice)} грн</s>` : ''}</div>` : ''}
      <h2 class="ptitle"><span class="brand">${esc(p.brand)}</span> ${esc(p.model)}</h2>
      <p class="pcat">${esc(CAT[p.cat]?.name || '')}</p>
      <div class="idrow">
        ${p.reserved ? '<span class="holdtag">Бронь</span>' : '<span class="oktag">В наявності</span>'}</div>
      ${p.reserved ? '<p class="notice">Товар заброньований. Напишіть нам — підкажемо, чи звільниться.</p>' : ''}
      <section class="pblock"><h3 class="h3">Характеристики</h3><dl class="specs">${specsOf(p).map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
        ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}</section>
      <section class="pblock info"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M8.8 12.2l2.2 2.2 4.2-4.4"/></svg>
        <div><h3 class="h3">${p.warrantyText ? `Гарантія ${esc(p.warrantyText)}` : 'Гарантія — уточнюйте'}</h3><p class="muted">Перевіряємо кожен прилад перед продажем. Якщо щось не так — ремонт або заміна.</p></div></section>
      <section class="pblock info"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 1 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
        <div><h3 class="h3">Де подивитись</h3><p>м. ${esc(SHOP.city)}, ${esc(SHOP.address)} (${esc(SHOP.addressHint)})</p><a class="link" href="${SHOP.mapUrl}" target="_blank" rel="noopener">Відкрити на карті</a></div></section>
    </div>
    ${sim.length ? `<section class="similar"><h3 class="h3">Схожі товари</h3><div class="simrow">${sim.map(x => card(x, null, true)).join('')}</div></section>` : ''}
  </article>`;
  $('#pfoot').innerHTML = `<a class="btn primary block" href="https://t.me/${SHOP.tg}?text=${encodeURIComponent(msg(p))}" target="_blank" rel="noopener">Написати в Telegram</a>
    <a class="btn vb" href="viber://chat?number=%2B${SHOP.viber}" data-viber>Viber</a>`;
  $('#pbody').scrollTop = 0; $('#pmini').classList.remove('on');
  const tr = $('#pbody .gtrack');
  tr.onscroll = () => { const i = Math.round(tr.scrollLeft / tr.clientWidth); $('#pbody').querySelectorAll('.dots span').forEach((d, k) => d.className = k === i ? 'on' : ''); const pv = $('#pbody .prev'), nx = $('#pbody .next'); if (pv) { pv.disabled = i === 0; nx.disabled = i >= n - 1; } };
}
$('#pbody').addEventListener('scroll', e => $('#pmini').classList.toggle('on', e.target.scrollTop > 120));
$('#pbody').addEventListener('click', async e => {
  const g = e.target.closest('[data-g]'); if (g) { const tr = $('#pbody .gtrack'); tr.scrollBy({left: +g.dataset.g * tr.clientWidth, behavior: 'smooth'}); return; }
});
$('#pfoot').addEventListener('click', e => { if (e.target.closest('[data-viber]')) copyText(msg(BY.get(openId))).then(ok => ok && toast('Текст скопійовано — вставте його у Viber')); });
function showProduct(id, mode) {
  const p = BY.get(id); if (!p) return;
  if (mode === 'push') history.pushState({sheet: 1}, '', toURL(S, id)); else if (mode === 'replace') history.replaceState(history.state, '', toURL(S, id));
  openId = id; renderProduct(p); sheetOpen($('#psheet'));
}
function closeProduct() {
  if (history.state?.sheet) history.back();
  else { openId = null; history.replaceState(null, '', toURL(S, null)); sheetClose($('#psheet')); }
}
addEventListener('popstate', () => {
  S = fromURL(); const p = new URLSearchParams(location.search).get('p'); render();
  if (p && BY.has(p)) { openId = p; renderProduct(BY.get(p)); sheetOpen($('#psheet')); } else { openId = null; sheetClose($('#psheet')); }
});

/* ---------- події сторінки ---------- */
$('#qclear').innerHTML = X(14);
$('#q').addEventListener('input', e => setState({...S, q: e.target.value}));
$('#qclear').onclick = () => { setState({...S, q: ''}); $('#q').focus(); };
$('#sort').onchange = e => setState({...S, sort: e.target.value === 'relevance' ? undefined : e.target.value});
$('#cats').onclick = e => { const b = e.target.closest('[data-cat]'); if (!b) return; const c = b.dataset.cat || null; setState({...S, cat: S.cat === c ? null : c}); };
$('#prices').onclick = e => {
  if (e.target.closest('#fopen')) { draft = {...S}; renderFilters(); sheetOpen($('#fsheet')); return; }
  const b = e.target.closest('[data-preset]'); if (!b) return; const r = PRESETS.find(x => x.id === b.dataset.preset);
  setState(S.pmin === r.min && S.pmax === r.max ? {...S, pmin: undefined, pmax: undefined} : {...S, pmin: r.min, pmax: r.max});
};
document.addEventListener('click', e => {
  if (e.target.closest('[data-resetall]')) return setState({...EMPTY, sort: S.sort});
  const rm = e.target.closest('[data-rm]'); if (rm) return setState(activeChips(S)[+rm.dataset.rm].rm(S));
  const a = e.target.closest('a[data-open]');
  if (a && !(e.metaKey || e.ctrlKey || e.shiftKey || e.button)) { e.preventDefault(); showProduct(a.dataset.open, openId ? 'replace' : 'push'); }
});
document.addEventListener('error', e => { const i = e.target; if (i.tagName === 'IMG' && i.dataset.cat) i.parentNode.innerHTML = illustration(i.dataset.cat, 'Фото недоступне'); }, true);

function footer() {
  const t = UPDATED ? new Date(UPDATED) : null;
  $('#footer').innerHTML = `<p>${esc(SHOP.name)}, м. ${esc(SHOP.city)}, ${esc(SHOP.address)}</p>${t && !isNaN(t) ? `<p>Каталог оновлено ${t.toLocaleString('uk-UA', {day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'})}</p>` : ''}`;
}
fetch('products.json', {cache: 'no-cache'}).then(r => r.json()).catch(() => ({products: []})).then(d => {

});
