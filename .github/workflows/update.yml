name: Update products
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: update-products
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet telethon==1.46.0 cryptg
      - if: ${{ inputs.probe }}
        run: cd scripts && python tg_probe.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
      - if: ${{ !inputs.probe }}
        run: python scripts/scrape.py
        env:
          # Необов'язково: вхід у ваш Telegram для приватних каналів (див. TELEGRAM.md)
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
      # Статичні сторінки розділів і товарів + sitemap.xml для Google (scripts/seo.mjs)
      - run: node scripts/seo.mjs
      - if: ${{ !inputs.probe }}
        run: |
          git config user.name "shop-bot"
          git config user.email "shop-bot@users.noreply.github.com"
          git add products.json
          git add -A -- img/tg 2>/dev/null || true
          git add -A -- katalog tovar sitemap.xml
          # Поки збирали товари, у main могли злити інші зміни: підтягуємо їх перед відправкою.
          git diff --cached --quiet || (git commit -m "update products" && git pull --rebase -X theirs origin main && git push)
