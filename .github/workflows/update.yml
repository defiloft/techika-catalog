name: Update products
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: update-products
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet telethon==1.46.0 cryptg
      - run: python scripts/scrape.py
        env:
          # Необов'язково: вхід у ваш Telegram для приватних каналів (див. TELEGRAM.md)
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
      - if: ${{ inputs.probe }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          d = json.load(open("products.json"))["products"]
          e = [p for p in d if p.get("extra") and all(os.path.exists(i) for i in p["images"])]
          print("всього з extra:", sum(bool(p.get("extra")) for p in d))
          keep = {i for p in e[:12] for i in p["extra"]}
          for f in pathlib.Path("img/tg/req").glob("*.jpg"):
              f.unlink() if str(f) not in keep else None
          pathlib.Path("test").mkdir(exist_ok=True)
          json.dump({p["pid"]: p["extra"] for p in e[:12]}, open("test/extra.json", "w"), indent=1)
          PY
          git config user.name "shop-bot"
          git config user.email "shop-bot@users.noreply.github.com"
          git add test img/tg/req && git commit -m "test sample" && git push
      - if: ${{ !inputs.probe }}
        run: |
          git config user.name "shop-bot"
          git config user.email "shop-bot@users.noreply.github.com"
          git add products.json
          git add -A -- img/tg 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update products" && git push)
