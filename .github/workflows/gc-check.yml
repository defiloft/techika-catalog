name: gc-check (temporary)
on:
  push:
    branches: [claude/project-thread-ue6cp6]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in TOTAL %2F click-telegram; do echo "== $p"; curl -s -w "\nHTTP %{http_code}\n" "https://techika-catalog.goatcounter.com/counter/$p.json"; done
          echo "== site"; curl -s -o /dev/null -w "HTTP %{http_code}\n" https://techika-catalog.goatcounter.com/
          echo "== count.js"; curl -s -o /dev/null -w "HTTP %{http_code}\n" https://gc.zgo.at/count.js
      - uses: actions/checkout@v4
      - run: python3 scripts/stats.py
